<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AegisGuard | Live Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/shared.css" />
<link rel="stylesheet" href="css/live-monitoring.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <img class="sidebar-logo" src="../../resources/logoNonBackground.png" alt="AegisGuard" />

      <nav class="nav-list">
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item active" href="live-monitoring.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
          <span>Live Monitoring</span>
        </a>
        <a class="nav-item" href="account-management.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.8 13.6c2.3.2 4.2 2.1 4.2 4.9"/></svg>
          <span>Account Management</span>
        </a>
        <a class="nav-item" href="security-logs.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
          <span>Security Logs</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <button class="nav-item nav-logout" type="button" id="logoutBtn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"/><path d="M14 16.5 19 12l-5-4.5M19 12H9"/></svg>
        <span>Log Out</span>
      </button>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1 class="page-title font-tech">Live Monitoring</h1>
          <p class="page-subtitle">Real-time screen view of monitored endpoints</p>
        </div>
        <div class="topbar-actions">
          <label class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.2-3.2"/></svg>
            <input type="text" id="searchInput" placeholder="Search hostname or user" />
          </label>
          <label class="control-select">
            <select id="statusFilter">
              <option value="">All Status</option>
              <option value="Online">Online</option>
              <option value="Offline">Offline</option>
              <option value="Connecting">Connecting</option>
              <option value="Not installed">Not installed</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 9 6 6 6-6"/></svg>
          </label>
        </div>
      </div>

      <div class="endpoint-grid" id="endpointGrid">
        <p class="empty-state">Loading endpoints&hellip;</p>
      </div>
    </main>
  </div>

  <div class="modal-scrim" id="detailScrim">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-header">
        <div class="detail-title-row">
          <h2 class="page-title font-tech" id="detailTitle"></h2>
          <span class="badge" id="detailStatusBadge"></span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" type="button" id="detailRefreshBtn">Force Refresh</button>
          <button class="btn btn-primary" type="button" id="detailDownloadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg>
            Download Installer
          </button>
          <button class="modal-close modal-close-box" type="button" id="closeDetailBtn" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>

      <p class="form-error" id="detailError"></p>

      <div class="detail-body">
        <div class="detail-screen">
          <div class="detail-screen-preview">
            <img class="detail-screen-img" id="detailScreenImg" alt="Live screen of this computer" hidden />
            <svg id="detailScreenPlaceholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
          </div>
          <div class="detail-live-indicator">
            <span class="live-dot" id="detailLiveDot"></span>
            <span id="detailLiveText"></span>
          </div>
        </div>
        <div class="detail-info panel">
          <h3 class="panel-title font-tech">Endpoint Information</h3>
          <dl class="info-list" id="detailInfoList"></dl>
        </div>
      </div>

      <div class="panel detail-activity">
        <h3 class="panel-title font-tech">Recent Activity</h3>
        <div id="detailActivity"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/endpoint-detail.js"></script>
  <script src="js/live-monitoring.js"></script>
</body>
</html>
