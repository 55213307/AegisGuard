# Nginx site for the AegisGuard company portal: public port 80 -> uvicorn on 127.0.0.1:8002.
# Install: sudo cp nginx-aegisguard.conf /etc/nginx/sites-available/aegisguard
#          sudo ln -s /etc/nginx/sites-available/aegisguard /etc/nginx/sites-enabled/
#          sudo rm /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Don't advertise the Nginx version.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
