<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AegisGuard | Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/shared.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card" id="loginCard">
      <img class="login-logo" src="../../resources/logoNonBackground.png" alt="AegisGuard" />

      <h1 class="login-heading font-tech">Welcome Back</h1>
      <p class="login-subtitle">Sign in to your company portal</p>

      <form class="login-form" id="loginForm" novalidate>
        <div>
          <label class="login-field-label" for="username">Username</label>
          <input class="login-field-input" type="text" id="username" name="username" placeholder="e.g. j.tan" autocomplete="username" required />
        </div>
        <div>
          <label class="login-field-label" for="password">Password</label>
          <input class="login-field-input" type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
        </div>

        <button class="login-submit" type="submit">Sign In</button>
        <p class="login-error" id="errorMessage" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
