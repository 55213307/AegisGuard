<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AegisGuard | Change Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/shared.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card" id="loginCard">
      <img class="login-logo" src="../../resources/logoNonBackground.png" alt="AegisGuard" />

      <h1 class="login-heading font-tech">Set a New Password</h1>
      <p class="login-subtitle">For security, replace the password you were issued before continuing.</p>

      <form class="login-form" id="changePasswordForm" novalidate>
        <div>
          <label class="login-field-label" for="currentPassword">Current Password</label>
          <input class="login-field-input" type="password" id="currentPassword" placeholder="Password you were issued" autocomplete="current-password" required />
        </div>
        <div>
          <label class="login-field-label" for="newPassword">New Password</label>
          <input class="login-field-input" type="password" id="newPassword" placeholder="At least 8 characters, letters and numbers" autocomplete="new-password" required />
        </div>
        <div>
          <label class="login-field-label" for="confirmPassword">Confirm New Password</label>
          <input class="login-field-input" type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required />
        </div>

        <button class="login-submit" type="submit">Update Password</button>
        <p class="login-error" id="errorMessage" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
